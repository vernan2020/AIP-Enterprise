<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img" aria-labelledby="title desc">
  <title id="title">Tico Trader</title>
  <desc id="desc">Tico Trader wordmark in white and green with the multicolor geometric market mark.</desc>
  <rect width="700" height="200" fill="transparent"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="92">
    <text x="18" y="132" fill="#ffffff">TICO</text>
    <text x="232" y="132" fill="#76b82a">TRADER</text>
  </g>
  <g transform="translate(592 64)">
    <polygon points="0,67 33,0 52,67" fill="#18a9c7"/>
    <polygon points="33,0 64,51 52,67" fill="#8cc63f"/>
    <polygon points="52,67 64,51 83,67" fill="#f6bf1f"/>
    <polygon points="64,51 115,18 96,67 83,67" fill="#ef3f36"/>
    <polygon points="64,51 83,67 52,67" fill="#f08b22"/>
  </g>
</svg>
