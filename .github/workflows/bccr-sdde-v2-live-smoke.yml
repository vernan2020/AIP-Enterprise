name: BCCR SDDE v2 live smoke

on:
  pull_request:
    branches:
      - feature/ux-v451-rtilb-xml-integration
    paths:
      - 'src/aip/integration/bccr/connector/sdde_v2_client.py'
      - 'src/aip/integration/bccr/connector/sdde_v2_diagnostic.py'
      - 'src/aip/integration/bccr/providers/sdde_v2_http_provider.py'
      - '.github/workflows/bccr-sdde-v2-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bccr-official:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/bccr-sdde-v2-macro'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: src
      AIP_BCCR_ENABLED: 'true'
      AIP_BCCR_TOKEN: ${{ secrets.AIP_BCCR_TOKEN }}
      AIP_BCCR_BASE_URL: https://apim.bccr.fi.cr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HTTP client
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Verify new SDDE client with official live BCCR series 317
        run: |
          python -m aip.integration.bccr.connector.sdde_v2_diagnostic --codes 317 --days 20
      - name: Inspect independently exchange sell, policy and basic rates
        continue-on-error: true
        run: |
          python -m aip.integration.bccr.connector.sdde_v2_diagnostic --codes 318 3541 423 --days 32
