name: Recovery Autofix Imports

on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829
    paths:
      - .github/workflows/recovery-autofix-imports.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-import-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply import-only fixes
        run: |
          ruff check --select I --fix \
            src/aip/integration/economic/official_indicator_mappings.py \
            src/aip/product/configured/adapters/configured_economic_indicators_provider.py \
            src/aip/product/configured/adapters/configured_market_provider.py \
            src/aip/product/economic/econometric_dataset_builder.py
          git diff --check

      - name: Commit deterministic import fixes
        run: |
          if git diff --quiet; then
            echo "No import-order changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/aip/integration/economic/official_indicator_mappings.py \
            src/aip/product/configured/adapters/configured_economic_indicators_provider.py \
            src/aip/product/configured/adapters/configured_market_provider.py \
            src/aip/product/economic/econometric_dataset_builder.py
          git commit -m "style: normalize recovered runtime imports"
          git push origin HEAD:recovery/full-runtime-rc1-20260829
