name: Fix PR 179 mypy

on:
  push:
    branches:
      - feature/financial-analysis-full-sugef-charts-20260914

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply typed table-item narrowing
        run: |
          python -c "from pathlib import Path; p=Path('src/aip/ui/modules/financial_analysis/views/financial_analysis_view.py'); t=p.read_text(encoding='utf-8'); old='            values = [\n                (\n                    self._statement_table.item(row, column).text()\n                    if self._statement_table.item(row, column) is not None\n                    else \"\"\n                )\n                for column in range(3)\n            ]\n'; new='            values: list[str] = []\n            for column in range(3):\n                table_item = self._statement_table.item(row, column)\n                values.append(table_item.text() if table_item is not None else \"\")\n'; assert old in t, 'Expected mypy-failing block was not found'; p.write_text(t.replace(old,new,1),encoding='utf-8')"
      - name: Format and validate file
        run: |
          python -m pip install black==26.5.1
          black src/aip/ui/modules/financial_analysis/views/financial_analysis_view.py
          python -m py_compile src/aip/ui/modules/financial_analysis/views/financial_analysis_view.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/aip/ui/modules/financial_analysis/views/financial_analysis_view.py
          git commit -m "Fix typed financial statement filtering"
          git push origin HEAD:${GITHUB_REF_NAME}
