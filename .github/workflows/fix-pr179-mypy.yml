name: Fix PR 179 mypy

on:
  push:
    branches:
      - feature/financial-analysis-full-sugef-charts-20260914

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply typed table-item narrowing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/aip/ui/modules/financial_analysis/views/financial_analysis_view.py')
          text = path.read_text(encoding='utf-8')
          old = '''            values = [
                (
                    self._statement_table.item(row, column).text()
                    if self._statement_table.item(row, column) is not None
                    else ""
                )
                for column in range(3)
            ]
'''
          new = '''            values: list[str] = []
            for column in range(3):
                table_item = self._statement_table.item(row, column)
                values.append(table_item.text() if table_item is not None else "")
'''
          if old not in text:
              raise SystemExit('Expected mypy-failing block was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and validate file
        run: |
          python -m pip install black==26.5.1 mypy==2.3.1
          black src/aip/ui/modules/financial_analysis/views/financial_analysis_view.py
          PYTHONPATH=src mypy src/aip/ui/modules/financial_analysis/views/financial_analysis_view.py --follow-imports=skip --ignore-missing-imports || true
          python -m py_compile src/aip/ui/modules/financial_analysis/views/financial_analysis_view.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/aip/ui/modules/financial_analysis/views/financial_analysis_view.py
          git commit -m "Fix typed financial statement filtering"
          git push origin HEAD:${GITHUB_REF_NAME}
