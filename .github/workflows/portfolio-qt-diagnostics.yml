name: Portfolio Qt Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - feature/portfolio-advanced-analytics-roadmap

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONPATH: src
  AIP_SUGEF_FINANCIAL_API_ENABLED: "false"

jobs:
  qt-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        selection:
          - portfolio-ui
          - all-ui
          - portfolio-domain
          - full-unit-teardown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run isolated diagnostic tests
        shell: bash
        run: |
          case "${{ matrix.selection }}" in
            portfolio-ui) pytest tests/unit/ui/portfolio -q -W error -o faulthandler_timeout=180 ;;
            all-ui) pytest tests/unit/ui -q -W error -o faulthandler_timeout=180 ;;
            portfolio-domain) pytest tests/unit/domain/portfolio -q -W error -o faulthandler_timeout=180 ;;
            full-unit-teardown) PYTHONFAULTHANDLER=1 pytest tests/unit -vv -W error -o faulthandler_timeout=180 ;;
          esac
