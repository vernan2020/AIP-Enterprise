name: Apply Coopealianza Header Logo

on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829
    paths:
      - .github/workflows/apply-coopealianza-header-logo.yml

permissions:
  contents: write

jobs:
  apply-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0

      - name: Insert official Coopealianza logo in institutional header
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/aip/ui/shell/main_window.py")
          text = path.read_text(encoding="utf-8")

          import_anchor = "from aip.ui.navigation.navigation_manager import NavigationManager\n"
          import_line = (
              "from aip.ui.resources.coopealianza_logo import coopealianza_logo_pixmap\n"
          )
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Navigation import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          # Header final: blanco predominante, identidad Coopealianza y máxima legibilidad.
          text = text.replace("frame.setMinimumHeight(58)", "frame.setMinimumHeight(66)", 1)
          text = text.replace("frame.setMinimumHeight(66)", "frame.setMinimumHeight(66)", 1)
          text = text.replace(
              '"QFrame#institutionalHeader {background:#173F63; border:none;}"',
              '"QFrame#institutionalHeader {background:#FFFFFF; border:none; border-bottom:2px solid #00A9E0;}"',
              1,
          )
          text = text.replace(
              '"QFrame#institutionalHeader {background:#00345F; border:none;}"',
              '"QFrame#institutionalHeader {background:#FFFFFF; border:none; border-bottom:2px solid #00A9E0;}"',
              1,
          )
          text = text.replace(
              '"QFrame#institutionalHeader QLabel {background:transparent; border:none; color:#FFFFFF;}"',
              '"QFrame#institutionalHeader QLabel {background:transparent; border:none; color:#00345F;}"',
              1,
          )
          text = text.replace(
              '"QLabel#headerMode {background:#245A84; border:1px solid #4E7EA2; border-radius:10px; "',
              '"QLabel#headerMode {background:#F0F8FC; border:1px solid #73B3DD; border-radius:10px; "',
              1,
          )
          text = text.replace(
              '"padding:4px 9px; color:#EAF3FA; font-size:9px; font-weight:700;}"',
              '"padding:4px 9px; color:#005EB8; font-size:9px; font-weight:700;}"',
              1,
          )
          text = text.replace(
              '"QLabel#headerStatus {background:#246B5A; border:1px solid #4A907F; border-radius:10px; "',
              '"QLabel#headerStatus {background:#E2F6F1; border:1px solid #40C1AC; border-radius:10px; "',
              1,
          )
          text = text.replace(
              '"padding:4px 9px; color:#FFFFFF; font-size:9px; font-weight:700;}"',
              '"padding:4px 9px; color:#167A68; font-size:9px; font-weight:700;}"',
              1,
          )

          anchor = (
              '        execution_mode = self._config.execution_mode\n\n'
              '        title_box = QVBoxLayout()\n'
          )
          replacement = (
              '        execution_mode = self._config.execution_mode\n\n'
              '        logo = QLabel()\n'
              '        logo.setObjectName("coopealianzaHeaderLogo")\n'
              '        logo.setFixedSize(236, 48)\n'
              '        logo.setAlignment(Qt.AlignmentFlag.AlignVCenter | Qt.AlignmentFlag.AlignLeft)\n'
              '        logo.setPixmap(\n'
              '            coopealianza_logo_pixmap().scaled(\n'
              '                220,\n'
              '                42,\n'
              '                Qt.AspectRatioMode.KeepAspectRatio,\n'
              '                Qt.TransformationMode.SmoothTransformation,\n'
              '            )\n'
              '        )\n'
              '        logo.setStyleSheet(\n'
              '            "QLabel#coopealianzaHeaderLogo {background:transparent; border:none;}"\n'
              '        )\n'
              '        layout.addWidget(logo)\n\n'
              '        title_box = QVBoxLayout()\n'
          )
          if 'logo.setObjectName("coopealianzaHeaderLogo")' not in text:
              if anchor not in text:
                  raise SystemExit("Header insertion anchor not found")
              text = text.replace(anchor, replacement, 1)
          else:
              text = text.replace(
                  'logo.setAlignment(Qt.AlignmentFlag.AlignCenter)',
                  'logo.setAlignment(Qt.AlignmentFlag.AlignVCenter | Qt.AlignmentFlag.AlignLeft)',
                  1,
              )
              text = text.replace(
                  '"QLabel#coopealianzaHeaderLogo {background:#FFFFFF; "\n'
                  '            "border:1px solid #D5DEE3; border-radius:7px; padding:2px 6px;}"',
                  '"QLabel#coopealianzaHeaderLogo {background:transparent; border:none;}"',
                  1,
              )

          # Texto del producto sobre el header blanco.
          text = text.replace(
              '"font-size:15px; font-weight:800; letter-spacing:0.7px; background:transparent;"',
              '"font-size:15px; font-weight:800; letter-spacing:0.7px; color:#00345F; background:transparent;"',
              1,
          )
          text = text.replace(
              '"font-size:8px; color:#BFD3E2; letter-spacing:1px; background:transparent;"',
              '"font-size:8px; color:#00A9E0; letter-spacing:1px; background:transparent;"',
              1,
          )
          text = text.replace(
              '"font-size:8px; color:#BFD3E2; font-weight:700; background:transparent;"',
              '"font-size:8px; color:#566D7C; font-weight:700; background:transparent;"',
              1,
          )

          path.write_text(text, encoding="utf-8")

      - name: Validate syntax
        run: python -m py_compile src/aip/ui/shell/main_window.py src/aip/ui/resources/coopealianza_logo.py

      - name: Commit header branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/aip/ui/shell/main_window.py
          git diff --cached --quiet && exit 0
          git commit -m "feat(brand): insertar logo Coopealianza en header institucional"
          git push origin HEAD:recovery/full-runtime-rc1-20260829
