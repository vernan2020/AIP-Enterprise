name: Recovery Import Normalization

on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829
    paths:
      - .github/workflows/recovery-import-normalization.yml

permissions:
  contents: write

jobs:
  normalize-imports:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: python -m pip install 'ruff>=0.12'

      - name: Normalize recovered import blocks
        run: |
          ruff check --select I --fix \
            src/aip/product/configured/adapters/configured_market_provider.py \
            src/aip/product/configured/repositories/institutional_macro_scenario_compatibility_store.py \
            src/aip/product/configured/services/configured_macro_intelligence_service.py \
            src/aip/product/configured/services/configured_portfolio_var_service.py \
            src/aip/product/economic/institutional_macro_driver_service.py \
            src/aip/product/economic/institutional_macro_scenario_service.py \
            src/aip/product/economic/institutional_macro_scenario_workflow_service.py
          git diff --check

      - name: Commit normalized imports
        run: |
          if git diff --quiet; then
            echo 'Import blocks already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/aip/product/configured/adapters/configured_market_provider.py \
            src/aip/product/configured/repositories/institutional_macro_scenario_compatibility_store.py \
            src/aip/product/configured/services/configured_macro_intelligence_service.py \
            src/aip/product/configured/services/configured_portfolio_var_service.py \
            src/aip/product/economic/institutional_macro_driver_service.py \
            src/aip/product/economic/institutional_macro_scenario_service.py \
            src/aip/product/economic/institutional_macro_scenario_workflow_service.py
          git commit -m 'style(recovery): normalize recovered import ordering'
          git push origin HEAD:recovery/full-runtime-rc1-20260829
