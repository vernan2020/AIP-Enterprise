name: Format Certified Runtime

on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829
    paths:
      - ".github/workflows/quality-format-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: src
  QT_QPA_PLATFORM: offscreen

jobs:
  format-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Normalize imports and formatting
        run: |
          isort src tests
          black src tests
      - name: Validate deterministic quality gates
        run: |
          ruff check src tests
          black --check src tests
          isort --check-only src tests
          python -m compileall -q src tests
      - name: Run institutional regression after formatting
        run: |
          pytest -q -W error \
            tests/unit/domain/liquidity \
            tests/unit/domain/relative_value \
            tests/unit/extensions/coopealianza/liquidity \
            tests/unit/extensions/coopealianza/treasury/decision \
            tests/unit/product/configured/context \
            tests/unit/domain/portfolio/test_portfolio.py
      - name: Commit deterministic formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "Runtime already formatted."
            exit 0
          fi
          git commit -m "quality: normalize certified runtime formatting"
          git push origin HEAD:recovery/full-runtime-rc1-20260829
