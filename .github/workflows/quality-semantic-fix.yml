name: Apply Controlled Runtime Quality Fixes

# Re-run after safe Ruff cleanup on the frozen materialized source.
on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829
    paths:
      - ".github/workflows/quality-semantic-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: src
  QT_QPA_PLATFORM: offscreen

jobs:
  semantic-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed semantic fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def remove_line_containing(path: str, needle: str) -> None:
              p = Path(path)
              lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
              matches = [i for i, line in enumerate(lines) if needle in line]
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one line containing {needle!r}, found {len(matches)}')
              del lines[matches[0]]
              p.write_text(''.join(lines), encoding='utf-8')

          replace_once('src/aip/integration/folderwatch/connector/folder_connector.py', '            normalized = self.normalizer.normalize(request.to_dict())\n', '            self.normalizer.normalize(request.to_dict())\n')
          replace_once('src/aip/platform/observability/logging/logger_factory.py', '        effective = config or ObservabilityConfig()\n', '        _ = config or ObservabilityConfig()\n')
          remove_line_containing('src/aip/product/__init__.py', 'from aip.product.demo import __version__ as __version__')
          remove_line_containing('src/aip/product/configured/adapters/configured_portfolio_provider.py', 'vector_records_available_for_matching =')
          remove_line_containing('src/aip/product/configured/adapters/configured_portfolio_provider.py', 'price_vector_positions =')
          remove_line_containing('src/aip/product/configured/adapters/configured_portfolio_provider.py', 'directory_name = vector_root.name')
          remove_line_containing('src/aip/product/configured/adapters/configured_portfolio_provider.py', 'directory_name = str(vector_root)')
          remove_line_containing('src/aip/product/configured/services/institutional_matching_service.py', 'matching_key = self._compose_key(series, maturity)')
          replace_once(
              'src/aip/tools/reconcile_portfolio_valuation.py',
              '    print("TOP 30 POSITIONS CONTRIBUTING TO DIFFERENCE")\n'
              '    for index, (_, row) in enumerate(differences[:30], start=1):\n'
              '        source_values = row.get("source_values", {}) or {}\n'
              '        colonized = _field_value(row, "valor mercado colonizado")\n',
              '    print("TOP 30 POSITIONS CONTRIBUTING TO DIFFERENCE")\n'
              '    for index, (_, row) in enumerate(differences[:30], start=1):\n'
              '        colonized = _field_value(row, "valor mercado colonizado")\n',
          )
          remove_line_containing('src/aip/tools/reconcile_portfolio_valuation.py', 'amortized = sum(1 for row in rows if "amort" in str(row.get("classification", "")).lower())')

          app_factory = Path('src/aip/product/demo/bootstrap/application_factory.py')
          app_text = app_factory.read_text(encoding='utf-8')
          import_line = 'from aip.product.configured.context.valuation_date_context import ValuationDateContext\n'
          if import_line not in app_text:
              anchor = 'from aip.core.container import Container\n'
              if anchor not in app_text:
                  raise SystemExit('application_factory.py: import anchor not found')
              app_text = app_text.replace(anchor, anchor + import_line, 1)
              app_factory.write_text(app_text, encoding='utf-8')

          mil_request = Path('src/extensions/coopealianza/liquidity/mil/models/mil_request.py')
          mil_text = mil_request.read_text(encoding='utf-8')
          if 'from typing import TYPE_CHECKING, Any\n' not in mil_text:
              if 'from typing import Any\n' not in mil_text:
                  raise SystemExit('mil_request.py: typing import anchor not found')
              mil_text = mil_text.replace('from typing import Any\n', 'from typing import TYPE_CHECKING, Any\n', 1)
          type_block = ('\nif TYPE_CHECKING:\n' '    from src.extensions.coopealianza.liquidity.mil.models.mil_asset import MilAsset\n')
          if 'if TYPE_CHECKING:' not in mil_text:
              anchor = 'from typing import TYPE_CHECKING, Any\n'
              mil_text = mil_text.replace(anchor, anchor + type_block, 1)
          mil_request.write_text(mil_text, encoding='utf-8')

          test_path = Path('tests/unit/domain/portfolio/test_portfolio.py')
          test_text = test_path.read_text(encoding='utf-8')
          function_marker = 'def test_institutional_currency_normalization_handles_usd_and_crc_variants() -> None:\n'
          if function_marker not in test_text:
              raise SystemExit('portfolio test function marker not found')
          before, after = test_text.split(function_marker, 1)
          start = after.find('    positions = [\n')
          first_assert = after.find('    assert PortfolioCalculationService._normalize_institutional_currency')
          if start < 0 or first_assert < 0 or first_assert <= start:
              raise SystemExit('dead positions fixture boundaries not found')
          after = after[:start] + after[first_assert:]
          test_path.write_text(before + function_marker + after, encoding='utf-8')

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff must be clean
        run: ruff check src tests
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run focused affected tests
        run: |
          pytest tests/unit/domain/portfolio/test_portfolio.py -q -W error
          if [ -d tests/unit/extensions/coopealianza/liquidity/mil ]; then pytest tests/unit/extensions/coopealianza/liquidity/mil -q -W error; fi
      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No reviewed quality changes required."
            exit 0
          fi
          git commit -m "quality: resolve remaining Ruff findings safely"
          git push origin HEAD:recovery/full-runtime-rc1-20260829
