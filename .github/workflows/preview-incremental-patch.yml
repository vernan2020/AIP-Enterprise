name: AIP V4.5.1 Preview Incremental ZIP

on:
  pull_request:
    branches:
      - release/core-v1.0
    paths:
      - "src/**"
      - "scripts/**"
      - "run_aip_configured.cmd"
      - "run_aip_ux_preview.cmd"
      - "DIAGNOSTICAR_BCCR_SUGEF.cmd"
      - "AUDITAR_FUENTES_CONFIGURADAS.cmd"
      - "INSPECCIONAR_HISTORICOS_PREVIEW.cmd"
      - "pyproject.toml"
      - ".github/workflows/preview-incremental-patch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-preview-package:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/ux-v4-5-1-performance-responsiveness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "AIP source HEAD $(git rev-parse HEAD)"
      - name: Validate updater before packaging
        run: |
          python -m pip install pytest black
          black --check --diff scripts/qa/build_preview_patch.py scripts/qa/apply_preview_patch.py tests/unit/qa/test_preview_patch.py
          PYTHONPATH=. python -m pytest -q tests/unit/qa/test_preview_patch.py
      - name: Build ZIP and verify payload
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          mkdir -p preview-artifacts
          python scripts/qa/build_preview_patch.py --output "preview-artifacts/AIP-V451-PREVIEW-${HEAD_SHA}.zip"
          python - <<'PY'
          import glob
          import hashlib
          import json
          import zipfile
          from io import BytesIO
          from pathlib import Path
          from scripts.qa.apply_preview_patch import verify_payload

          path = Path(glob.glob("preview-artifacts/*.zip")[0])
          checksum = path.with_suffix(path.suffix + ".sha256").read_text().split()[0]
          assert hashlib.sha256(path.read_bytes()).hexdigest() == checksum
          with zipfile.ZipFile(path) as archive:
              members = set(archive.namelist())
              assert "manifest.json" in members
              assert "INSTALAR_PREVIEW.cmd" in members
              manifest = json.loads(archive.read("manifest.json"))
              assert len(manifest["files"]) > 100
              for item in manifest["files"]:
                  assert hashlib.sha256(archive.read("payload/" + item["path"])).hexdigest() == item["sha256"]
                  assert not item["path"].endswith((".ttf", ".otf", ".woff", ".woff2", ".duckdb", ".wal"))
              print(f"Verified ${len(manifest['files'])} file hashes and archive SHA256")
          PY
      - name: Publish source-backed PREVIEW package
        uses: actions/upload-artifact@v4
        with:
          name: aip-v451-preview-incremental-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            preview-artifacts/*.zip
            preview-artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
