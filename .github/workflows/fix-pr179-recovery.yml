name: Fix PR 179 recovery

on:
  push:
    branches:
      - feature/financial-analysis-full-sugef-charts-20260914

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve canonical CRC history unit
        run: |
          python -c "from pathlib import Path; p=Path('src/aip/ui/modules/financial_analysis/presenters/financial_analysis_presenter.py'); t=p.read_text(encoding='utf-8'); old='            display_unit = f\"{series.unit} MM\" if series.unit else \"MM\"\n'; new='            display_unit = (\n                \"₡ MM\"\n                if series.unit == \"CRC\"\n                else (f\"{series.unit} MM\" if series.unit else \"MM\")\n            )\n'; assert old in t, 'Expected history display-unit block was not found'; p.write_text(t.replace(old,new,1),encoding='utf-8')"
      - name: Format and validate
        run: |
          python -m pip install black==26.5.1
          black src/aip/ui/modules/financial_analysis/presenters/financial_analysis_presenter.py
          python -m py_compile src/aip/ui/modules/financial_analysis/presenters/financial_analysis_presenter.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/aip/ui/modules/financial_analysis/presenters/financial_analysis_presenter.py
          git commit -m "Preserve CRC history display unit"
          git push origin HEAD:${GITHUB_REF_NAME}
