name: Materialize Certified Runtime Source

on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829
    paths:
      - ".github/workflows/export-recovery-src.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  materialize-certified-src:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify and restore certified runtime checkpoint
        run: python scripts/recovery/restore_runtime_checkpoint.py

      - name: Validate recovered production source
        shell: python
        run: |
          from pathlib import Path
          import ast

          required = [
              "src/aip/domain/economic/economic_indicator_catalog.py",
              "src/aip/domain/economic/economic_indicator_observation.py",
              "src/aip/domain/economic/economic_indicator_series.py",
              "src/aip/integration/economic/official_indicator_mappings.py",
              "src/aip/integration/bccr/normalization/economic_series_parser.py",
              "src/aip/product/configured/services/configured_portfolio_var_service.py",
              "src/aip/product/configured/adapters/configured_economic_indicators_provider.py",
              "src/aip/product/configured/adapters/configured_market_provider.py",
              "src/aip/product/configured/adapters/configured_liquidity_provider.py",
              "src/aip/product/configured/readers/institutional_icl_reader.py",
              "src/aip/ui/modules/macro_intelligence/views/macro_intelligence_view.py",
              "src/aip/ui/shell/main_window.py",
              "src/aip/ui/application/main.py",
              "src/aip/ui/application/app.py",
              "src/aip/tools/preflight_runtime.py",
          ]
          missing = [item for item in required if not Path(item).is_file()]
          if missing:
              raise SystemExit("certified checkpoint missing required source: " + ", ".join(missing))

          main_window = Path("src/aip/ui/shell/main_window.py").read_text(encoding="utf-8")
          if "demo_factory" not in main_window:
              raise SystemExit("certified MainWindow does not expose injected factory composition")

          for path in Path("src").rglob("*.py"):
              data = path.read_bytes()
              if b"\x00" in data:
                  raise SystemExit(f"null byte in source: {path}")
              ast.parse(data.decode("utf-8"), filename=str(path))

          print(f"certified materialized source validated: {len(required)} critical modules")

      - name: Compile recovered production source
        run: python -m compileall -q src

      - name: Remove generated recovery marker and caches
        shell: bash
        run: |
          rm -f .aip_runtime_checkpoint.sha256
          find src -type d -name __pycache__ -prune -exec rm -rf {} +
          find src -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Commit materialized certified runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src
          if git diff --cached --quiet; then
            echo "Certified runtime source is already fully materialized."
            exit 0
          fi
          git commit -m "Materialize certified RC1 runtime source"
          git push origin HEAD:recovery/full-runtime-rc1-20260829

      - name: Upload materialized source artifact
        uses: actions/upload-artifact@v4
        with:
          name: aip-rc1-materialized-src-${{ github.sha }}
          path: src
          if-no-files-found: error
          retention-days: 7
