name: Materialize Recovery Source

on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829
    paths:
      - ".github/workflows/export-recovery-src.yml"
      - "recovery/checkpoints/rc1-final-20260829/**"
      - "scripts/recovery/restore_runtime_checkpoint.py"
      - "scripts/recovery/salvage_runtime_checkpoint.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-src:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Salvage and verify recovered runtime source
        run: python scripts/recovery/salvage_runtime_checkpoint.py

      - name: Compile recovered source tree
        run: python -m compileall -q src

      - name: Commit materialized source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "Recovered runtime already materialized in src."
            exit 0
          fi
          git commit -m "Materialize recovered RC1 runtime source tree"
          git push origin HEAD:recovery/full-runtime-rc1-20260829

      - name: Upload materialized source tree
        uses: actions/upload-artifact@v4
        with:
          name: recovered-runtime-src-${{ github.sha }}
          path: src
          if-no-files-found: error
          retention-days: 3
