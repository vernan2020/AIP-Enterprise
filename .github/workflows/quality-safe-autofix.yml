name: Apply Safe Runtime Quality Fixes

# Re-run after freezing the materialized runtime source.
on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829
    paths:
      - ".github/workflows/quality-safe-autofix.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  safe-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install quality tools
        run: python -m pip install 'ruff>=0.12'
      - name: Apply Ruff safe fixes only
        run: ruff check src tests --fix
        continue-on-error: true
      - name: Compile after safe fixes
        run: python -m compileall -q src tests
      - name: Commit safe mechanical fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No safe Ruff changes required."
            exit 0
          fi
          git commit -m "quality: apply safe Ruff fixes to frozen runtime"
          git push origin HEAD:recovery/full-runtime-rc1-20260829
      - name: Report remaining Ruff findings
        run: ruff check src tests
