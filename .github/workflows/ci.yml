name: CI

# Certification run for the frozen, formatted recovered RC1 runtime.
# Ruff owns import ordering; Black owns formatting.
on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release/**
      - recovery/full-runtime-rc1-20260829

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONPATH: src
  # CI must remain deterministic; live SUGEF access is enabled by default
  # in the installed configured runtime and exercised through mocked clients.
  AIP_SUGEF_FINANCIAL_API_ENABLED: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile materialized production runtime
        run: python -m compileall -q src
      - name: Validate critical runtime modules
        shell: python
        run: |
          from pathlib import Path
          required = [
              'src/aip/product/configured/services/configured_portfolio_var_service.py',
              'src/aip/product/configured/services/configured_portfolio_dv01_service.py',
              'src/aip/product/configured/services/configured_portfolio_rate_shock_service.py',
              'src/aip/product/configured/adapters/configured_economic_indicators_provider.py',
              'src/aip/product/configured/adapters/configured_market_provider.py',
              'src/aip/product/configured/adapters/configured_liquidity_provider.py',
              'src/aip/product/configured/readers/institutional_icl_reader.py',
              'src/aip/ui/modules/macro_intelligence/views/macro_intelligence_view.py',
              'src/aip/product/economic/economic_snapshot_store.py',
              'src/aip/ui/application/main.py',
              'src/aip/ui/application/app.py',
          ]
          missing = [item for item in required if not Path(item).is_file()]
          if missing:
              raise SystemExit('missing critical runtime modules: ' + ', '.join(missing))
          bad = []
          for item in required:
              data = Path(item).read_bytes()
              if not data or b'\x00' in data:
                  bad.append(item)
          if bad:
              raise SystemExit('invalid critical runtime modules: ' + ', '.join(bad))
          print('materialized runtime source: PASS')

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
      - name: Black
        run: black --check --diff src tests
      - name: mypy
        run: mypy src
      - name: compileall
        run: python -m compileall src tests

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: pytest tests/unit -q -W error -o faulthandler_timeout=300
      - name: Run integration tests
        if: matrix.suite == 'integration'
        run: pytest tests/integration -q -W error -o faulthandler_timeout=300

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Coverage validation
        run: |
          pytest --cov=src --cov-report=term-missing -q -W error -o faulthandler_timeout=300
          # Enforce the measured full-runtime RC1 baseline without excluding
          # dormant or recovered modules from the denominator.
          coverage report --fail-under=74

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build distributions
        run: python -m build
      - name: Verify PREVIEW updater
        if: github.head_ref == 'feature/v451-integrated-operational-20261028'
        run: pytest -q tests/unit/qa/test_preview_patch.py
      - name: Build consolidated PREVIEW ZIP
        if: github.head_ref == 'feature/v451-integrated-operational-20261028'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-artifacts
          SHA="$(git rev-parse HEAD)"
          python scripts/qa/build_preview_patch.py --output "preview-artifacts/AIP-V451-INTEGRADA-${SHA}.zip"
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path
          paths = list(Path("preview-artifacts").glob("*.zip"))
          assert len(paths) == 1, paths
          path = paths[0]
          with zipfile.ZipFile(path) as archive:
              manifest = json.loads(archive.read("manifest.json"))
              assert manifest["source_sha"] == path.stem.rsplit("-", 1)[-1]
              assert "payload/DIAGNOSTICAR_BCCR_V2.cmd" in archive.namelist()
              assert "payload/src/aip/ui/widgets/table_excel_export.py" in archive.namelist()
              assert "payload/src/aip/product/configured/liquidity/sugef210_scenario_comparison.py" in archive.namelist()
              assert len(manifest["files"]) > 1000
              for item in manifest["files"]:
                  blob = archive.read("payload/" + item["path"])
                  assert hashlib.sha256(blob).hexdigest() == item["sha256"], item["path"]
          print("Verified consolidated ZIP and manifest", path)
          PY
      - name: Upload consolidated PREVIEW ZIP
        if: github.head_ref == 'feature/v451-integrated-operational-20261028'
        uses: actions/upload-artifact@v4
        with:
          name: aip-v451-integrada-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            preview-artifacts/*.zip
            preview-artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
