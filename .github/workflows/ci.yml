name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release/**
      - recovery/full-runtime-rc1-20260829

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONPATH: src

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify recovered runtime checkpoint
        run: python scripts/recovery/verify_runtime_checkpoint.py
      - name: Reconstruct checkpoint in isolated directory
        run: |
          mkdir -p /tmp/aip-restore
          cp -a recovery scripts /tmp/aip-restore/
          cd /tmp/aip-restore
          python scripts/recovery/restore_runtime_checkpoint.py
          python -m compileall src
          test -f src/aip/product/configured/services/configured_portfolio_var_service.py
          test -f src/aip/product/configured/adapters/configured_market_provider.py
          test -f src/aip/product/configured/adapters/configured_liquidity_provider.py
          test -f src/aip/ui/modules/macro_intelligence/views/macro_intelligence_view.py
          test -f src/aip/product/economic/economic_snapshot_store.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
      - name: Black
        run: black --check src tests
      - name: isort
        run: isort --check-only src tests
      - name: mypy
        run: mypy src tests
      - name: compileall
        run: python -m compileall src tests

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: pytest tests/unit -q -W error
      - name: Run integration tests
        if: matrix.suite == 'integration'
        run: pytest tests/integration -q -W error

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Coverage validation
        run: |
          pytest --cov=src --cov-report=term-missing -q -W error
          coverage report --fail-under=90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build distributions
        run: python -m build
