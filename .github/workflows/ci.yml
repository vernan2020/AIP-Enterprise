name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release/**
      - recovery/full-runtime-rc1-20260829

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  recovery-checkpoint:
    if: github.ref == 'refs/heads/recovery/full-runtime-rc1-20260829'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify certified checkpoint
        run: python scripts/recovery/verify_runtime_checkpoint.py
      - name: Restore certified checkpoint
        run: python scripts/recovery/restore_runtime_checkpoint.py
      - name: Compile restored runtime
        run: python -m compileall -q src
      - name: Verify runtime marker
        run: python scripts/recovery/runtime_checkpoint_status.py

  quality:
    if: github.ref != 'refs/heads/recovery/full-runtime-rc1-20260829'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
      - name: Black
        run: black --check src tests
      - name: isort
        run: isort --check-only src tests
      - name: mypy
        run: mypy src tests
      - name: compileall
        run: python -m compileall src tests

  tests:
    if: github.ref != 'refs/heads/recovery/full-runtime-rc1-20260829'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: pytest tests/unit -q -W error
      - name: Run integration tests
        if: matrix.suite == 'integration'
        run: pytest tests/integration -q -W error

  coverage:
    if: github.ref != 'refs/heads/recovery/full-runtime-rc1-20260829'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Coverage validation
        run: |
          pytest --cov=src --cov-report=term-missing -q -W error
          coverage report --fail-under=90

  package:
    if: github.ref != 'refs/heads/recovery/full-runtime-rc1-20260829'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build distributions
        run: python -m build
