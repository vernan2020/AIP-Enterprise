name: CI

# Certification run for the frozen, formatted recovered RC1 runtime.
# Ruff owns import ordering; Black owns formatting.
on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release/**
      - recovery/full-runtime-rc1-20260829

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONPATH: src
  # CI must remain deterministic; live SUGEF access is enabled by default
  # in the installed configured runtime and exercised through mocked clients.
  AIP_SUGEF_FINANCIAL_API_ENABLED: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile materialized production runtime
        run: python -m compileall -q src
      - name: Validate critical runtime modules
        shell: python
        run: |
          from pathlib import Path
          required = [
              'src/aip/product/configured/services/configured_portfolio_var_service.py',
              'src/aip/product/configured/services/configured_portfolio_dv01_service.py',
              'src/aip/product/configured/services/configured_portfolio_rate_shock_service.py',
              'src/aip/product/configured/adapters/configured_economic_indicators_provider.py',
              'src/aip/product/configured/adapters/configured_market_provider.py',
              'src/aip/product/configured/adapters/configured_liquidity_provider.py',
              'src/aip/product/configured/readers/institutional_icl_reader.py',
              'src/aip/ui/modules/macro_intelligence/views/macro_intelligence_view.py',
              'src/aip/product/economic/economic_snapshot_store.py',
              'src/aip/ui/application/main.py',
              'src/aip/ui/application/app.py',
          ]
          missing = [item for item in required if not Path(item).is_file()]
          if missing:
              raise SystemExit('missing critical runtime modules: ' + ', '.join(missing))
          bad = []
          for item in required:
              data = Path(item).read_bytes()
              if not data or b'\x00' in data:
                  bad.append(item)
          if bad:
              raise SystemExit('invalid critical runtime modules: ' + ', '.join(bad))
          print('materialized runtime source: PASS')

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
      - name: Black
        run: black --check --diff src tests
      - name: mypy
        run: mypy src
      - name: compileall
        run: python -m compileall src tests

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [unit-core, unit-ui, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      # PySide/Qt native QObjects are intentionally not torn down in the same
      # interpreter as the full set of non-UI unit modules. The monolithic
      # process segfaults during pytest's final GC on Linux (exit code 139),
      # although isolated UI and portfolio-domain suites pass. Keep all tests
      # exercised; do not skip failures or disable faulthandler.
      - name: Run non-UI unit tests
        if: matrix.suite == 'unit-core'
        run: pytest tests/unit --ignore=tests/unit/ui -q -W error -o faulthandler_timeout=300
      - name: Run Qt unit tests in separate process
        if: matrix.suite == 'unit-ui'
        run: pytest tests/unit/ui -q -W error -o faulthandler_timeout=300
      - name: Run integration tests
        if: matrix.suite == 'integration'
        run: pytest tests/integration -q -W error -o faulthandler_timeout=300

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Coverage validation across isolated pytest processes
        run: |
          # Combine execution from every suite in a single coverage data file.
          # Only the Python/Qt process boundary changes, never the denominator.
          coverage erase
          coverage run -m pytest tests/unit --ignore=tests/unit/ui -q -W error -o faulthandler_timeout=300
          coverage run --append -m pytest tests/unit/ui -q -W error -o faulthandler_timeout=300
          coverage run --append -m pytest tests/integration -q -W error -o faulthandler_timeout=300
          # Preserve the certified full-runtime 74% coverage threshold.
          coverage report --fail-under=74

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Build distributions
        run: python -m build
