name: Recovery Black Normalization

on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829
    paths:
      - ".github/workflows/recovery-black-normalize.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install formatters
        run: python -m pip install "black==26.5.1" "ruff==0.16.5"

      - name: Align localized UI assertions
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("tests/unit/ui/executive/test_executive_navigation.py"): [
                  ('assert "Executive" in tab_titles', 'assert "Ejecutivo" in tab_titles'),
              ],
              Path("tests/integration/ui/test_demo_rc1_smoke.py"): [
                  ('== "Executive"', '== "Ejecutivo"'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")

      - name: Normalize recovered Python formatting
        run: |
          black --quiet \
            src/aip/domain/economic/economic_indicator_catalog.py \
            src/aip/domain/portfolio/risk/historical_price_series_service.py \
            src/aip/domain/portfolio/risk/portfolio_historical_var_service.py \
            src/aip/domain/portfolio/services/portfolio_dv01_aggregation_service.py \
            src/aip/integration/economic/indicator_source_mapper.py \
            src/aip/integration/bccr/connector/rest_client.py \
            src/aip/product/configured/repositories/economic_historical_repository.py \
            src/aip/product/configured/repositories/institutional_macro_scenario_repository.py \
            src/aip/product/configured/repositories/economic_historical_store.py \
            src/aip/product/configured/repositories/master_historical_price_repository.py \
            src/aip/product/configured/repositories/pipca_historical_price_repository.py \
            src/aip/product/configured/services/configured_macro_intelligence_service.py \
            src/aip/product/configured/repositories/institutional_macro_scenario_compatibility_store.py \
            src/aip/product/configured/services/institutional_market_relative_value_service.py \
            src/aip/product/configured/repositories/institutional_macro_scenario_store.py \
            src/aip/product/configured/services/institutional_relative_value_service.py \
            src/aip/product/configured/services/institutional_portfolio_rotation_service.py \
            src/aip/product/configured/services/institutional_market_curve_service.py \
            src/aip/ui/shell/main_window.py \
            tests/unit/product/configured/test_macro_intelligence_runtime_compatibility.py \
            tests/unit/ui/executive/test_executive_navigation.py \
            tests/integration/ui/test_demo_rc1_smoke.py
          ruff check src tests
          black --check src tests
          git diff --check

      - name: Commit normalization
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "chore(recovery): normalize recovered Python formatting"
          git push origin HEAD:recovery/full-runtime-rc1-20260829
