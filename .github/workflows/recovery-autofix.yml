name: Recovery Autoformat

on:
  push:
    branches:
      - recovery/full-runtime-rc1-20260829

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip autofix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/full-runtime-rc1-20260829
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Apply safe Ruff fixes
        run: ruff check src tests --fix || true

      - name: Apply Black formatting
        run: black src tests

      - name: Apply import ordering
        run: isort src tests

      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "chore: normalize recovered runtime quality [skip autofix]"
          git push origin HEAD:recovery/full-runtime-rc1-20260829
