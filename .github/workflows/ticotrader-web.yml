name: TicoTrader private web
on:
  push:
    branches: [feature/ticotrader-financial-macro]
  pull_request:
    paths: ["ticotrader_web/**", "tests/web/**", ".github/workflows/ticotrader-web.yml"]
permissions:
  contents: read
jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ticotrader_web/requirements.txt
      - run: python -m pip install -r ticotrader_web/requirements.txt pytest
      - run: PYTHONPATH=src:. python -m pytest tests/web -q
      - run: node --check ticotrader_web/static/app.js
      - run: docker build -f ticotrader_web/Dockerfile -t ticotrader-research:ci .
