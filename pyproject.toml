[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aip-enterprise"
version = "1.0.0rc1"
description = "AIP Enterprise - Plataforma de gestión integral de portafolios de inversión"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - Coopealianza R.L." }
authors = [{ name = "Coopealianza R.L." }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]
dependencies = [
  "PySide6>=6.9",
  "duckdb>=1.3",
  "PyYAML>=6.0",
  "loguru>=0.7",
  "pydantic>=2.11",
  "platformdirs>=4.4",
  "importlib-resources>=6.0",
  "xlrd>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "black>=24.10",
  "build>=1.2",
  "coverage>=7.4",
  "isort>=5.13",
  "mypy>=1.17",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
  "pyinstaller>=6.15",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.12",
  "bandit>=1.7",
  "xlwt>=1.3",
]

[project.scripts]
aip-enterprise = "aip.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "AIP-Enterprise"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Full recovered-RC1 baseline (27k+ statements). Keep this as a ratchet:
# increases are welcome, reductions must be justified explicitly.
fail_under = 74

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_return_any = false
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
  "src.aip.core.di.*",
  "src.aip.domain.financial_math.*",
  "src.aip.domain.instruments.*",
  "src.aip.domain.portfolio.*",
  "src.aip.shared.*",
  "src.extensions.coopealianza.liquidity.*",
]
ignore_errors = true
