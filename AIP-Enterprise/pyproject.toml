[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aip-enterprise"
version = "0.1.0"
description = "AIP Enterprise - Plataforma de gestión integral de portafolios de inversión"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary - Coopealianza R.L." }
authors = [{ name = "Coopealianza R.L." }]
dependencies = [
  "PySide6>=6.9",
  "duckdb>=1.3",
  "PyYAML>=6.0",
  "loguru>=0.7",
  "pydantic>=2.11",
  "platformdirs>=4.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "ruff>=0.12",
  "mypy>=1.17",
  "pyinstaller>=6.15"
]

[project.scripts]
aip-enterprise = "aip.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
